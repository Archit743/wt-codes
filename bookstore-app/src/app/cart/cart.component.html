<div class="cart-container">
    <h2>Your Cart</h2>
    
    <div *ngIf="cartItems.length === 0" class="empty-cart">
      <p>Your cart is empty.</p>
      <a routerLink="/">Continue Shopping</a>
    </div>
  
    <div *ngIf="cartItems.length > 0">
      <div class="cart-items">
        <div *ngFor="let item of cartItems" class="cart-item">
          <div class="cart-item-details">
            <h3>{{ item.title }}</h3>
            <p><strong>Author:</strong> {{ item.author }}</p>
            <p><strong>Price:</strong> ${{ item.price }}</p>
          </div>
          <div class="cart-item-actions">
            <button class="remove-btn" (click)="removeFromCart(item.id)">Remove</button>
          </div>
        </div>
      </div>
      
      <div class="cart-summary">
        <h3>Order Summary</h3>
        <p><strong>Total Items:</strong> {{ cartItems.length }}</p>
        <p><strong>Total Amount:</strong> <span class="total-price">${{ total.toFixed(2) }}</span></p>
        <button class="checkout-btn" (click)="checkout()">Proceed to Checkout</button>
      </div>
    </div>
  </div>
