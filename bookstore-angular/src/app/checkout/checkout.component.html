<div class="checkout-container">
    <h2>Checkout</h2>
    
    <div class="order-summary">
      <h3>Order Summary</h3>
      <p><strong>Total Items:</strong> {{ cartItems.length }}</p>
      <p><strong>Total Amount:</strong> <span class="total-amount">${{ total.toFixed(2) }}</span></p>
    </div>
    
    <div class="checkout-form">
      <h3>Shipping Information</h3>
      <div class="form-group">
        <label for="name">Full Name:</label>
        <input type="text" id="name" [(ngModel)]="customerName" required placeholder="Enter your full name">
      </div>
      
      <div class="form-group">
        <label for="email">Email Address:</label>
        <input type="email" id="email" [(ngModel)]="email" required placeholder="Enter your email address">
      </div>
      
      <div class="form-group">
        <label for="address">Shipping Address:</label>
        <textarea id="address" [(ngModel)]="address" required placeholder="Enter your complete shipping address"></textarea>
      </div>
      
      <button (click)="placeOrder()">Complete Purchase</button>
    </div>
  </div>
